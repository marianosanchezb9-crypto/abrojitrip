<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Europa 🌍 — Nuestro viaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ea; --panel:#fffdf8; --ink:#26384a; --muted:#7c8a94;
  --line:#e6ddc9; --accent:#4a7a8c; --accent-soft:#e3eef1; --sand:#c98a4b; --warn:#b5533c; --warnbg:#faece0;
  --nav:#1f3347; --sage:#8fa888;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;}
.script{font-family:'Caveat',cursive;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --panel:#1a2220; --ink:#eef0ee; --muted:#96a29c;
    --line:#2a332f; --accent:#4fb59f; --accent-soft:#173028; --sand:#e8a752; --warn:#e17663; --warnbg:#31201c;
    --nav:#0b1210;
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --panel:#1a2220; --ink:#eef0ee; --muted:#96a29c;
  --line:#2a332f; --accent:#4fb59f; --accent-soft:#173028; --sand:#e8a752; --warn:#e17663; --warnbg:#31201c;
  --nav:#0b1210;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 18px 10px;border-bottom:1px solid var(--line);}
header.top .eyebrow{font-size:.78rem;color:var(--muted);margin:0;}
header.top h1{margin:2px 0 0;font-size:1.5rem;font-weight:800;letter-spacing:-.3px;}
main{padding:16px 16px 92px;max-width:640px;margin:0 auto;}
.view{display:none;} .view.active{display:block;}
h2.section{font-size:1.05rem;font-weight:700;margin:26px 0 12px;}
h2.section:first-child{margin-top:4px;}
.coverhero{width:100%;aspect-ratio:16/9;background-size:cover;background-position:center;border-radius:22px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 4px 18px rgba(38,56,74,.18);}
.coverhero-overlay{position:absolute;left:16px;bottom:14px;background:#fffdf8ee;padding:10px 16px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.12);}
.hero{background:linear-gradient(135deg,var(--accent) 0%,#2c5064 100%);color:#fff;border-radius:22px;padding:20px;margin-bottom:6px;}
.hero .tag{font-size:.75rem;opacity:.85;}
.hero h3{margin:4px 0 14px;font-size:1.3rem;}
.hero .row{display:flex;gap:18px;font-size:.85rem;margin-bottom:4px;flex-wrap:wrap;}
.hero .row div{opacity:.95;}
.hero a.btn-ghost{display:inline-block;margin-top:14px;background:#ffffff26;color:#fff;text-decoration:none;
  padding:9px 16px;border-radius:12px;font-size:.85rem;font-weight:600;cursor:pointer;}
.quickrow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;}
.quickcard{flex:none;width:88px;text-align:center;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:14px 6px;cursor:pointer;}
.quickcard .ic{font-size:1.4rem;} .quickcard .lb{font-size:.72rem;margin-top:6px;color:var(--ink);font-weight:600;}
.destcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);}
.destcard{display:flex;align-items:center;gap:0;}
.destcard .thumb{width:84px;height:84px;flex:none;object-fit:cover;border-radius:16px;margin:10px;}
.destcard .body{flex:1;padding:10px 14px 10px 0;}
.destcard .chev{margin-right:14px;color:var(--muted);font-size:1.3rem;}
.destcard .body{padding:14px 16px 16px;}
.destcard h3{margin:0 0 2px;font-size:1.05rem;}
.destcard .meta{font-size:.82rem;color:var(--muted);margin-bottom:10px;}
.destcard a.btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;
  padding:8px 14px;border-radius:10px;font-size:.82rem;cursor:pointer;}
.routewrap{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:6px;}
.routewrap svg{width:100%;height:auto;display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;}
.card h3{margin:0 0 4px;font-size:.98rem;}
.card .meta{font-size:.8rem;color:var(--muted);line-height:1.4;}
.pill{display:inline-block;font-size:.68rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:6px;}
.pill.warn{background:var(--warnbg);color:var(--warn);}
.pill.muted{background:var(--line);color:var(--muted);}
.warnbox{background:var(--warnbg);border-radius:14px;padding:12px 14px;font-size:.85rem;margin-bottom:10px;color:var(--ink);}
.warnbox b{color:var(--warn);}
.city-tabs{display:flex;overflow-x:auto;gap:8px;margin-bottom:14px;padding-bottom:2px;}
.city-tabs button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600;}
.city-tabs button.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.catrow{display:flex;overflow-x:auto;gap:8px;margin-bottom:12px;}
.catrow button{flex:none;border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px;font-size:.78rem;color:var(--ink);}
.catrow button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.day{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;background:var(--panel);}
.day summary{padding:12px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-size:.92rem;}
.day summary::-webkit-details-marker{display:none;}
.actcard{margin:0 12px 10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;font-size:.86rem;}
.actcard .t{font-weight:700;color:var(--accent);font-size:.78rem;}
.placecard{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--panel);}
.placecard .info{flex:1;}
.placecard h4{margin:0;font-size:.9rem;}
.placecard .meta{font-size:.76rem;color:var(--muted);}
.placecard a{font-size:.76rem;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap;}
.placecard{cursor:pointer;} .placecard.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;}
.routewrap svg circle{cursor:pointer;}
.activeplace{margin:10px 0;}
.activeplace .card{border-color:var(--accent);}
.maphint{font-size:.78rem;color:var(--muted);text-align:center;padding:8px 0 2px;}
.mapstage{position:relative;overflow:hidden;border-radius:18px;background:var(--panel);box-shadow:0 6px 18px rgba(38,56,74,.12);border:1px solid var(--line);}
.mapstage iframe{width:100%;display:block;border:0;}
.placecard a.mini{font-size:.9rem;color:var(--muted);text-decoration:none;}
a.mini,.mini{font-size:.8rem;color:var(--accent);text-decoration:none;font-weight:700;}
nav.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nav);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;}
nav.bottom button{flex:1;background:none;border:none;color:#ffffff85;padding:10px 2px 8px;font-size:.65rem;font-weight:600;}
nav.bottom button.active{color:#fff;}
nav.bottom .ic{display:block;font-size:1.2rem;margin-bottom:2px;}
.doclist{margin:0;padding:0;list-style:none;}
.doclist li{padding:10px 0;border-top:1px solid var(--line);font-size:.87rem;}
.doclist li:first-child{border-top:none;}
.searchbar{margin:10px 0 4px;}
.searchbar input{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:.9rem;background:var(--panel);color:var(--ink);}
.daynote{margin:0 12px 10px;padding:10px 12px;border-left:3px solid var(--sand);background:var(--warnbg);border-radius:0 12px 12px 0;font-size:.84rem;}
.infotbl{width:100%;border-collapse:collapse;font-size:.8rem;margin:4px 0 8px;}
.infotbl th{text-align:left;color:var(--muted);font-weight:700;padding:6px 6px 6px 0;border-bottom:1px solid var(--line);}
.infotbl td{padding:6px 6px 6px 0;border-bottom:1px solid var(--line);vertical-align:top;}
.infolist{margin:0;padding:0;list-style:none;font-size:.84rem;}
.infolist li{padding:5px 0;border-top:1px solid var(--line);}
.infolist li:first-child{border-top:none;}
.mapillu{position:relative;width:100%;aspect-ratio:1000/707;background-size:cover;background-position:center;border-radius:16px;overflow:hidden;}
.mapillu .hot{position:absolute;min-width:44px;min-height:44px;padding:0;margin:0;border:0;background:transparent;border-radius:18px;cursor:pointer;outline:none;transition:background .2s,box-shadow .2s,transform .2s;}
.mapillu .hot::after{content:attr(data-name);position:absolute;left:50%;bottom:100%;transform:translate(-50%,4px);background:var(--nav);color:#fff;font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:2;}
.mapillu .hot:hover,.mapillu .hot:focus-visible{background:radial-gradient(closest-side,#ffffff55,#ffffff00);box-shadow:0 0 22px 6px #ffffff88;transform:scale(1.06);}
.mapillu .hot:hover::after,.mapillu .hot:focus-visible::after{opacity:1;transform:translate(-50%,-4px);}
.mapillu .hot:active{transform:scale(.97);}
.mapillu .hot.low::after{bottom:auto;top:100%;transform:translate(-50%,-4px);}
.mapillu .hot.low:hover::after,.mapillu .hot.low:focus-visible::after{transform:translate(-50%,4px);}
.routearrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.routecap{font-size:.78rem;color:var(--muted);text-align:center;margin:8px 0 4px;letter-spacing:.2px;}
.pdcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 14px;color:var(--ink);font:inherit;cursor:pointer;}
.pdcard .pdic{font-size:1.6rem;}
.pdcard .pdtx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.pdcard .pdtx b{font-size:.98rem;}
.pdcard .pdtx span{font-size:.78rem;color:var(--muted);}
.pdcard .chev{color:var(--muted);font-size:1.3rem;}
.backbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;font-size:.85rem;padding:4px 0 10px;cursor:pointer;}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.danger{background:var(--warn);color:#fff;}
.btn[disabled]{opacity:.5;cursor:default;}
.pdform{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0 14px;display:flex;flex-direction:column;gap:10px;}
.pdform label{font-size:.78rem;font-weight:700;color:var(--muted);}
.pdform input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink);}
.pdform input[type=file]{width:100%;font-size:.82rem;color:var(--ink);}
.pdchips{display:flex;flex-wrap:wrap;gap:6px;}
.pdchips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:.76rem;cursor:pointer;}
.pditem{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;}
.pditem h4{margin:0;font-size:.92rem;overflow-wrap:anywhere;}
.pditem .meta{font-size:.75rem;color:var(--muted);margin:2px 0 8px;}
.pditem .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.pditem .acts a,.pditem .acts button{font:inherit;font-size:.8rem;font-weight:700;border-radius:10px;padding:7px 12px;border:1px solid var(--line);background:var(--bg);color:var(--accent);text-decoration:none;cursor:pointer;}
.pditem .acts button.del{color:var(--warn);}
.pdmsg{font-size:.82rem;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);margin:8px 0;}
.pdmsg.err{background:var(--warnbg);}
.pdform[hidden]{display:none;}

.routewrap .mapillu{border-radius:22px;box-shadow:0 6px 22px rgba(38,56,74,.18);}
.stay{display:block;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 12px;}
.stay .lbl{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.stay .nm{font-weight:700;font-size:.95rem;margin:4px 0 2px;}
.stay a.addr{display:inline-block;color:var(--accent);font-weight:600;text-decoration:none;font-size:.9rem;line-height:1.4;padding:4px 0;}
.stay .meta{margin-top:2px;}
details.poi,details.daybtn{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin:0 0 12px;overflow:hidden;}
details.poi>summary,details.daybtn>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;min-height:56px;}
details.poi>summary::-webkit-details-marker,details.daybtn>summary::-webkit-details-marker{display:none;}
details.poi>summary .t,details.daybtn>summary .t{font-weight:700;font-size:.95rem;}
details.daybtn>summary .t small{display:block;font-weight:500;font-size:.8rem;color:var(--muted);margin-top:2px;line-height:1.3;}
details.poi>summary .go,details.daybtn>summary .go{flex:none;font-size:.8rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:7px 12px;border-radius:999px;white-space:nowrap;}
details.poi>summary .go::before{content:"▾";font-size:1rem;} details.poi[open]>summary .go::before{content:"▴";font-size:1rem;}
.mapblock{margin:0 0 12px;}
.mapblock .mapstage{border-radius:20px;}
details.daybtn>summary .go::before{content:"Ver itinerario";} details.daybtn[open]>summary .go::before{content:"Cerrar";}
details.poi .poibody{padding:0 14px 14px;}
details.daybtn .daybody{padding-bottom:4px;}
details.poi>summary:focus-visible,details.daybtn>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
h2.section.sub{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;}
</style>
</head>

// ---- Mapa real de Google My Maps (embed), usando los datos reales para la lista de lugares ----
const MYMAPS_MID='1mrnFnqbU67h5wbl8hcqwslt41pqjiMM';
function cityMapEmbedHtml(city){
 const src=`https://www.google.com/maps/d/embed?mid=${MYMAPS_MID}&ll=${city.lat},${city.lon}&z=13`;
 return `<div class="mapstage"><iframe src="${src}" height="380" loading="lazy" allowfullscreen title="Mapa de ${city.name}"></iframe></div>`;
}
function placesForDay(cityId, dayIdx){
  const city=cities.find(c=>c.id===cityId); const day=city.days[dayIdx];
  const all=mapPlaces[cityId]||[];
  const hay=day.items.map(it=>it[1].toLowerCase());
  return all.filter(p=>{
   if(p[3]==='H') return true;
   const token=p[0].split(',')[0].split(' — ')[0].trim().toLowerCase();
   const keys=[token].concat((p[5]||[]).map(a=>a.toLowerCase()));
   return keys.some(k=>k.length>3 && hay.some(h=>h.includes(k)));
  });
}
function renderPlacesList(cityId){
 const all=mapPlaces[cityId]||[];
 if(!all.length) return '';
 const cats=[...new Set(all.map(p=>p[3]))];
 const legend = cats.map(c=>`<span style="display:inline-flex;align-items:center;gap:4px;font-size:.74rem;color:var(--muted);margin-right:10px;"><span style="width:9px;height:9px;border-radius:50%;background:${catInfo[c][1]};display:inline-block;border:1px solid #0b1210;"></span>${catInfo[c][0]}</span>`).join('');
 const list = all.map(p=>`<div class="placecard"><div class="info"><h4>${p[0]} <span class="pill" style="background:${catInfo[p[3]][1]}22;color:${catInfo[p[3]][1]};border:none;">${catInfo[p[3]][0]}</span></h4>${p[4]?`<div class="meta">${p[4]}</div>`:''}</div><a class="mini" href="https://www.google.com/maps/search/?api=1&query=${p[1]},${p[2]}" target="_blank">↗</a></div>`).join('');
 return `<div id="mapLegend" style="margin:10px 0 6px;">${legend}</div><div>${list}</div>`;
}
function renderCityInfo(city){
  if(!city.info||!city.info.length) return '';
  let h='<h2 class="section" style="font-size:.9rem;color:var(--muted);">Información de la guía</h2>';
  h+=city.info.map(s=>{
    let b='';
    if(s.p) b+=s.p.map(x=>`<div class="meta" style="margin-bottom:6px;">${x}</div>`).join('');
    if(s.head) b+=`<table class="infotbl"><thead><tr>${s.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    if(s.list) b+=`<ul class="infolist">${s.list.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    return `<details class="day"><summary>${s.t}</summary><div style="padding:0 14px 12px;">${b}</div></details>`;
  }).join('');
  if(city.foot) h+=`<div class="meta" style="margin:6px 2px 0;">${city.foot}</div>`;
  return h;
}
function stayHtml(city){
 const h=hospedajes.find(x=>x.c===city.id);
 const dir=h?h.dir:'';
 const maps=dir?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`:'';
 const nm=h?h.nombre:city.accom.nombre;
 const ci=h?h.checkin:city.accom.checkin, co=h?h.checkout:city.accom.checkout;
 return `<div class="stay"><div class="lbl">📍 Hospedaje</div><div class="nm">${nm}</div>${dir?`<a class="addr" href="${maps}" target="_blank" rel="noopener">${dir} ↗</a>`:''}<div class="meta">Check-in ${ci} · Check-out ${co}</div></div>`;
}
function dayCard(city,day,i){
 const parts=day.d.split(' · ');
 const dateTxt=parts[0], title=parts.slice(1).join(' · ');
 const dp=placesForDay(city.id,i).filter(p=>p[3]!=='H');
 const dpTxt = dp.length ? `<div class="meta" style="margin-top:6px;">📍 Lugares de interés de este día: ${dp.map(p=>p[0]).join(', ')}.</div>` : '';
 return `<details class="daybtn"><summary><span class="t">Día ${i+1} — ${dateTxt}${title?`<small>${title}</small>`:''}</span><span class="go"></span></summary><div class="daybody">`
  + day.items.map(it=>`<div class="actcard"><div class="t">${it[0]}</div>${it[1]}${it[2]?`<div class="meta" style="margin-top:3px;">${it[2]}</div>`:''}</div>`).join('')
  + (day.note?`<div class="daynote">${day.note}</div>`:'') + `<div style="padding:0 12px 12px;">${dpTxt}</div></div></details>`;
}
function renderDays(){
 const city = cities.find(c=>c.id===currentCity);
 const el = document.getElementById('daysContainer');
 let html = `<div style="display:flex;align-items:center;gap:12px;margin:2px 0 14px;"><img src="data:image/webp;base64,${cityThumbs[city.id]}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:16px;flex:none;"><div><h2 style="margin:0;font-size:1.35rem;">${city.name} ${city.flag}</h2><div class="meta">${city.dates}</div></div></div>`;
 html += stayHtml(city);
 html += `<div class="mapblock">${cityMapEmbedHtml(city)}</div>`;
 html += `<details class="poi"><summary><span class="t">Lugares de interés</span><span class="go"></span></summary><div class="poibody">${renderPlacesList(city.id)}</div></details>`;
 html += `<h2 class="section sub">Itinerario</h2>`;
 if(!city.days.length){ html += `<div class="card">Itinerario día a día pendiente para ${city.name} (no hay guía todavía).</div>`; }
 else html += city.days.map((day,i)=>dayCard(city,day,i)).join('');
 html += renderCityInfo(city);
 el.innerHTML = html;
}

function doSearch(){
 const q = document.getElementById('searchInput').value.trim().toLowerCase();
 if(!q){ switchView('inicio'); return; }
 switchView('buscar');
 let r=[];
 cities.forEach(c=>c.days.forEach(day=>day.items.forEach(it=>{ if((it[1]+day.d+c.name).toLowerCase().includes(q)) r.push(`<div class="card"><span class="pill muted">${c.flag} ${c.name}</span><b>${it[0]}</b> — ${it[1]}<div class="meta">${day.d}</div></div>`); })));
 transports.forEach(t=>{ if((t.tipo+t.txt).toLowerCase().includes(q)) r.push(`<div class="card">${fmtPill(t.estado)}<h3>${t.tipo}</h3><div class="meta">${t.txt}</div></div>`); });
 cities.forEach(c=>{ if((c.accom.nombre+c.name).toLowerCase().includes(q)) r.push(`<div class="card"><h3>${c.flag} ${c.accom.nombre}</h3><div class="meta">${c.accom.ciudad}</div></div>`); });
 Object.keys(mapPlaces).forEach(cid=>mapPlaces[cid].forEach(p=>{ if(p[0].toLowerCase().includes(q)) r.push(`<div class="placecard" onclick="openCity('${cid}')"><div class="info"><h4>${p[0]}</h4><div class="meta">${cid}</div></div><span class="mini">🗺️</span></div>`); }));
 document.getElementById('searchResults').innerHTML = r.length? r.join('') : '<div class="card">Sin resultados.</div>';
}

 const NA='Información no disponible';
 document.getElementById('hospList').innerHTML = hospedajes.map(x=>{
  const c=cities.find(k=>k.id===x.c);

  return `<div class="card"><span class="pill">${c.flag} ${c.name}</span><h3 style="margin-top:8px;">${x.nombre}</h3><div class="meta">📅 ${x.fechas} · 2 viajeros: Joana Marisa Calatrone, Mariano Sanchez</div>`+
   row('Dirección',x.dir)+row('Código de confirmación',x.codigo)+row('Check-in',x.checkin)+row('Check-out',x.checkout)+

 }).join('');
}
const DOC_CATS={
 pasajes:{ic:'✈️',t:'Pasajes',sub:'Vuelos, trenes, buses y otros traslados',chips:['Vuelo','Tren','Bus','Traslado','Comprobante'],empty:'Todavía no hay pasajes cargados. Tocá “+ Agregar documento” para sumar el primero.'},
 entradas:{ic:'🎟️',t:'Entradas y reservas',sub:'Museos, atracciones, tours y restaurantes',chips:['Entrada','Tour','Excursión','Reserva restaurante'],empty:'Todavía no hay entradas ni reservas cargadas.'},
 viaje:{ic:'📄',t:'Documentación del viaje',sub:'Alojamientos, seguro, visas y comprobantes',chips:['Seguro de viaje','Reserva de alojamiento','Visa o permiso','Comprobante'],empty:'Todavía no hay documentos del viaje cargados.'},
 personal:{ic:'🔐',t:'Documentación personal',sub:'DNI, pasaporte, licencia y documentación médica',chips:['Pasaporte','DNI','Licencia de conducir','Documentación médica'],empty:'Todavía no hay documentos personales cargados.'}
};
let currentDocTab='menu';
function renderDocCats(){
 document.getElementById('docCats').innerHTML=Object.keys(DOC_CATS).map(k=>{const c=DOC_CATS[k];return `<button type="button" class="pdcard" onclick="showDocTab('${k}')"><span class="pdic">${c.ic}</span><span class="pdtx"><b>${c.t}</b><span>${c.sub}</span></span><span class="chev">›</span></button>`;}).join('');
}
function itineraryTickets(){
 const re=/reserva|entrada|entradas|glasswalk|boleto/i; const out=[];
 cities.forEach(c=>c.days.forEach(day=>day.items.forEach(it=>{ if((re.test(it[1])||re.test(it[2]||''))&&!/vuelo|tren /i.test(it[1])) out.push({c,day:day.d.split(' · ')[0],t:it[0],x:it[1]}); })));
 return out;
}
function docStaticHtml(k){
 if(k==='pasajes'){
  const li=a=>a.map(d=>`<li><b>${d.n}</b> — ${d.v}</li>`).join('');
  return `<h3 class="section sub" style="margin-top:6px;">Vuelos</h3><ul class="doclist">${li(docs.flights)}</ul>
   <h3 class="section sub">Trenes</h3><ul class="doclist">${li(docs.trains)}</ul>
   <h3 class="section sub">Buses y otros traslados</h3><div class="meta" style="margin:0 2px 6px;">Sin registros por ahora. Podés cargar los comprobantes abajo.</div>
   <div class="warnbox" style="margin-top:14px;">📲 Recordatorio: para el vuelo Valencia→Roma (E1SEPP) hay que bajar la app de la aerolínea antes de viajar para tener el ticket de embarque a mano.</div>`;
 }
 if(k==='entradas'){
  const t=itineraryTickets();
  if(!t.length) return '';
  return `<h3 class="section sub" style="margin-top:6px;">En el itinerario</h3><ul class="doclist">${t.map(e=>`<li><span class="meta">${e.c.flag} ${e.c.name} · ${e.day} · ${e.t}</span><br>${e.x}</li>`).join('')}</ul>`;
 }
 if(k==='viaje'){
  return `<h3 class="section sub" style="margin-top:6px;">Alojamientos</h3><div class="warnbox">Datos tomados de los PDF de reserva de Airbnb. Esos PDF no incluyen reglas de la casa ni recomendaciones del anfitrión, así que esos campos no aparecen en las fichas.</div><div id="hospList"></div>`;
 }
 if(k==='personal'){
  return `<div class="meta">Pasaportes, DNI, licencia y documentación médica, a mano durante el viaje.</div><div class="warnbox" style="margin-top:10px;">🔐 <b>Privado.</b> Esta lista es de tu cuenta: no aparece en Inicio ni junto a los documentos del viaje. Los archivos se guardan en el almacenamiento de esta app, así que no la compartas con permiso de edición. Sin internet no se abren: guardá también una copia en el teléfono.</div>`;
 }
 return '';
}
function renderPdChips(k){
 const chips=document.getElementById('pdChips'); chips.innerHTML='';
 DOC_CATS[k].chips.forEach(n=>{ const b=document.createElement('button'); b.type='button'; b.textContent=n; b.onclick=()=>{ const i=document.getElementById('pdName'); i.value=n; i.focus(); }; chips.appendChild(b); });
}
function showDocTab(t){
  if(t==='hospedaje') t='viaje'; if(t==='reservas') t='pasajes';
  if(!DOC_CATS[t]) t='menu';
  currentDocTab=t; pd.cat=t==='menu'?pd.cat:t;
  const menu=t==='menu';
  document.getElementById('docMenu').hidden=!menu;
  document.getElementById('docCat').hidden=menu;
  if(!menu){
    const c=DOC_CATS[t];
    document.getElementById('docCatTitle').textContent=c.ic+' '+c.t;
    document.getElementById('docCatStatic').innerHTML=docStaticHtml(t);
    document.getElementById('docFilesTitle').textContent=t==='personal'?'Documentos guardados':'Mis archivos';
    if(t==='viaje') renderHospedaje();
    const f=document.getElementById('pdForm'); f.reset(); f.hidden=true;
    renderPdChips(t);
    initPersonal();
  }
  window.scrollTo(0,0);
}

// ---------- Documentos personales ----------
// Lista privada por cuenta (db: data/users/<id>/) + archivos en el almacenamiento de la app (assets).
// Si la vista no ofrece esas capacidades, la interfaz queda preparada y avisa.
const PD_TYPES={'application/pdf':['pdf','PDF'],'image/png':['png','Imagen'],'image/jpeg':['jpg','Imagen'],'image/webp':['webp','Imagen'],'image/gif':['gif','Imagen']};
const pd={cat:'personal',started:false,db:null,assets:null,dl:null,uid:null,col:null,docs:[],msg:null,err:null,confirmId:null,busy:false,ready:false};
function pdMsg(text,isErr){ pd.msg=text?{text,isErr:!!isErr}:null; renderPd(); }
function pdCodeText(e){
  const c=e&&e.code;
  if(c==='too_large') return 'El archivo supera el límite de 20 MB.';
  if(c==='unsupported_type') return 'Formato no admitido. Usá PDF, JPG o PNG.';
  if(c==='quota_or_state') return 'No hay espacio disponible en la app.';
  if(c==='rate_limited') return 'Demasiados intentos seguidos. Esperá un momento.';
  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed') return 'Esta vista no permite guardar archivos.';
  return 'No se pudo completar la acción. Probá de nuevo.';
}
async function initPersonal(){
  if(pd.started){ renderPd(); return; }
  pd.started=true; renderPd();
  try{
    const c=window.claude;
    if(c&&c.use){
      const get=async n=>{ try{ return await c.use(n); }catch(e){ return null; } };
      pd.db=await get('db'); pd.assets=await get('assets'); pd.dl=await get('downloads');
      const user=await get('user'); pd.uid=user?await user.id():null;
    }
  }catch(e){}
  if(pd.db&&pd.uid){
    try{
      pd.col=pd.db.collection('data/users/'+pd.uid);
      pd.col.onSnapshot(snap=>{ pd.docs=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(d=>d.assetId); pd.ready=true; renderPd(); },
        err=>{ pd.err=err&&err.code||'unavailable'; pd.ready=true; renderPd(); });
    }catch(e){ pd.err='unavailable'; pd.ready=true; }
  } else { pd.ready=true; }
  renderPd();
}
function pdFmtSize(n){ return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'; }
function renderPd(){
  const st=document.getElementById('pdStatus'); if(!st) return;
  const storageOk=!!(pd.db&&pd.uid&&!pd.err);
  const canUpload=storageOk&&!!pd.assets;
  st.innerHTML='';
  const add=(t,err)=>{ const d=document.createElement('div'); d.className='pdmsg'+(err?' err':''); d.textContent=t; st.appendChild(d); };
  if(pd.ready&&!storageOk) add('El almacenamiento seguro no está disponible en esta vista. La pantalla quedó lista para conectarse; por ahora no se pueden guardar archivos acá.',true);
  else if(pd.ready&&!pd.assets) add('Solo quien tiene permiso de edición de la app puede agregar o borrar archivos.',false);
  if(pd.msg) add(pd.msg.text,pd.msg.isErr);
  const btn=document.getElementById('pdAddBtn'); btn.disabled=!canUpload||pd.busy;
  if(!canUpload) document.getElementById('pdForm').hidden=true;
  const list=document.getElementById('pdList'); list.innerHTML='';
  if(!pd.ready){ const d=document.createElement('div'); d.className='meta'; d.textContent='Cargando…'; list.appendChild(d); return; }
  if(!pd.docs.filter(d=>(d.cat||'personal')===pd.cat).length){ const d=document.createElement('div'); d.className='card'; const h=document.createElement('div'); h.className='meta'; h.textContent=storageOk?DOC_CATS[pd.cat].empty:'Acá van a aparecer los documentos cuando el almacenamiento esté disponible.'; d.appendChild(h); list.appendChild(d); return; }
  pd.docs.filter(d=>(d.cat||'personal')===pd.cat).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(doc=>{
    const item=document.createElement('div'); item.className='pditem';
    const h=document.createElement('h4'); h.textContent='📄 '+(doc.name||'Documento'); item.appendChild(h);
    const t=PD_TYPES[doc.contentType]||['',''];
    const m=document.createElement('div'); m.className='meta';
    m.textContent=[t[1]||'Archivo',doc.sizeBytes?pdFmtSize(doc.sizeBytes):'',doc.createdAt?new Date(doc.createdAt).toLocaleDateString('es-AR'):''].filter(Boolean).join(' · ');
    item.appendChild(m);
    const acts=document.createElement('div'); acts.className='acts';
    const view=document.createElement('a'); view.href='/_blob/'+doc.assetId; view.target='_blank'; view.rel='noopener'; view.textContent='Ver'; acts.appendChild(view);
    if(pd.dl){ const dl=document.createElement('button'); dl.type='button'; dl.textContent='Descargar'; dl.onclick=()=>pdDownload(doc); acts.appendChild(dl); }
    if(canUpload){
      if(pd.confirmId===doc.id){
        const y=document.createElement('button'); y.type='button'; y.className='del'; y.textContent='Sí, eliminar'; y.onclick=()=>pdDelete(doc); acts.appendChild(y);
        const n=document.createElement('button'); n.type='button'; n.textContent='Cancelar'; n.style.color='var(--muted)'; n.onclick=()=>{ pd.confirmId=null; renderPd(); }; acts.appendChild(n);
      } else {
        const d=document.createElement('button'); d.type='button'; d.className='del'; d.textContent='Eliminar'; d.onclick=()=>{ pd.confirmId=doc.id; renderPd(); }; acts.appendChild(d);
      }
    }
    item.appendChild(acts); list.appendChild(item);
  });
}
async function pdDownload(doc){
  try{
    const r=await fetch('/_blob/'+doc.assetId); if(!r.ok) throw new Error('http');
    const blob=await r.blob(); const ext=(PD_TYPES[doc.contentType]||['pdf'])[0];
    const base=(doc.name||'documento').replace(/[\\/:*?"<>|]+/g,' ').trim()||'documento';
    await pd.dl.save({filename:base+'.'+ext,data:blob});
  }catch(e){ if(e&&e.code==='declined') return; pdMsg('No se pudo descargar. Usá “Ver” y guardalo desde ahí.',true); }
}
async function pdDelete(doc){
  if(pd.busy) return; pd.busy=true; pd.confirmId=null; renderPd();
  try{
    await pd.col.doc(doc.id).delete();
    try{ if(pd.assets) await pd.assets.delete(doc.assetId); }catch(e){}
    pdMsg('Documento eliminado.',false);
  }catch(e){ pdMsg(pdCodeText(e),true); }
  pd.busy=false; renderPd();
}
async function pdSubmit(ev){
  ev.preventDefault(); if(pd.busy||!pd.assets||!pd.col) return;
  const name=document.getElementById('pdName').value.trim(); const f=document.getElementById('pdFile').files[0];
  if(!name){ pdMsg('Escribí un nombre para el documento.',true); return; }
  if(!f){ pdMsg('Elegí un PDF o una foto.',true); return; }
  const type=f.type==='image/jpg'?'image/jpeg':f.type;
  if(!PD_TYPES[type]){ pdMsg('Formato no admitido. Usá PDF, JPG o PNG (una foto HEIC de iPhone hay que pasarla a JPG).',true); return; }
  pd.busy=true; document.getElementById('pdSave').disabled=true; pdMsg('Guardando…',false);
  let up=null;
  try{
    up=await pd.assets.upload(f,{type});
    await pd.col.doc().set({name,assetId:up.id,contentType:up.contentType,sizeBytes:up.sizeBytes,createdAt:Date.now(),cat:pd.cat});
    document.getElementById('pdForm').reset(); document.getElementById('pdForm').hidden=true;
    pdMsg('Documento guardado.',false);
  }catch(e){
    if(up){ try{ await pd.assets.delete(up.id); }catch(_){} }
    pdMsg(pdCodeText(e),true);
  }
  pd.busy=false; document.getElementById('pdSave').disabled=false; renderPd();
}
(function(){
  document.getElementById('pdAddBtn').onclick=()=>{ const f=document.getElementById('pdForm'); f.hidden=!f.hidden; if(!f.hidden) document.getElementById('pdName').focus(); };
  document.getElementById('pdCancel').onclick=()=>{ const f=document.getElementById('pdForm'); f.reset(); f.hidden=true; };
  document.getElementById('pdForm').addEventListener('submit',pdSubmit);
})();

renderRouteMap(); renderCityTabs(); renderDays(); renderTransport(); renderDocs(); showDocTab('menu');
</script>
